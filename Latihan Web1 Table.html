<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Latihan Web 01</title>

    <style>

        table {
            width: 600px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid orange;
        }
        
        header {
            height: 50px;
            background-color: #ffe4c4;

            text-align: center;
            padding-top: 20px;
        }

        nav {
            height: 30px;
            background-color: #cfe0f8;

            text-align: center;
            padding-top: 10px;
        }

        .konten {
            width: 70%;
            height: 180px;
            background-color: #f4cccc;

            padding: 20px;
            vertical-align: top;
        }

        .menu {
            width: 30%;
            height: 180px;
            background-color: #d9ead3;

            padding: 15px;
            vertical-align: middle;
        }

        footer {
            height: 30px;
            background-color: #ffe4c4;

            text-align: center;
            padding-top: 10px;
        }

        h1 {
            font-size: 24px;
        }

        p {
            font-size: 12px;
            width: 300px;
        }

    </style>

</head>


<body>

    <table>

        <!-- ================= HEADER ================= -->

        <tr>

            <td colspan="2">

                <header>
                    HEADER
                </header>

            </td>

        </tr>


        <!-- ================= NAVIGASI ================= -->

        <tr>

            <td colspan="2">

                <nav>
                    NAVIGASI
                </nav>

            </td>

        </tr>


        <!-- ================= KONTEN + MENU ================= -->

        <tr>

            <!-- KONTEN -->

            <td class="konten">

                <section>

                    <article>

                        <h1>
                            Heading 1
                        </h1>

                        <p>
                            Lorem ipsum dolor sit amet,
                            consectetur adipisicing elit,
                            sed do eiusmod tempor incididunt
                            ut labore et dolore magna aliqua.
                        </p>

                    </article>

                </section>

            </td>


            <!-- MENU -->

            <td class="menu">

                <aside>

                    <strong>
                        Menu:
                    </strong>

                    <ul>

                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>

                    </ul>

                </aside>

            </td>

        </tr>


        <!-- ================= FOOTER ================= -->

        <tr>

            <td colspan="2">

                <footer>
                    FOOTE
                </footer>

            </td>

        </tr>

    </table>

</body>

</html>
